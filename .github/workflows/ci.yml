name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    if: github.actor != 'unishare-release-bot[bot]'
    env:
      DATABASE_URL: postgresql://unigym:unigym@localhost:5432/unigym
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unigym
          POSTGRES_USER: unigym
          POSTGRES_PASSWORD: unigym
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unigym -d unigym"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/api db:deploy
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
