name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://unigym:unigym@localhost:5432/unigym
      # The e2e tests start their own mock uniAuth; these satisfy the startup check.
      BETTER_AUTH_URL: http://127.0.0.1:3003
      BETTER_AUTH_SECRET: ci-secret-at-least-thirty-two-characters
      UNIAUTH_ISSUER: http://127.0.0.1:39999/api/auth
      UNIAUTH_CLIENT_ID: ci-client
      UNIAUTH_CLIENT_SECRET: ci-client-secret
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unigym
          POSTGRES_USER: unigym
          POSTGRES_PASSWORD: unigym
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unigym -d unigym"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run --cwd apps/api db:deploy
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run --cwd apps/api test:e2e
      - run: bun run build

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.app }}
          platforms: linux/arm64
          push: false
