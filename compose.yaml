services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unigym
      POSTGRES_USER: unigym
      POSTGRES_PASSWORD: unigym
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unigym -d unigym"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
